[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    app(path): app directory, relative to the repo root, to build and boot
    smoke: boots the image and checks the banner
    shell: drives the Zephyr shell
    ztest: runs an in-firmware ztest suite
    unit: host-only checks, no QEMU
    fault: deliberately crashes or hangs the target
